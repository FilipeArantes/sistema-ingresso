services: 
  php:
    container_name: php-ingressos
    build:
      context: .
      dockerfile: Dockerfile
    image: php:fpm
    volumes:
      - ./:/var/www/html
    networks:
      - internal

  nginx:
    container_name: nginx-ingressos
    build:
      context: .
      dockerfile: .docker/nginx/Dockerfile
    image: ingressos-nginx
    ports:
      - "8081:80"
    volumes:
      - ./:/var/www/html
    networks:
      - internal

networks:
  internal:
    driver: bridge